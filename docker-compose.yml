services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homeserve}
      POSTGRES_USER: ${POSTGRES_USER:-homeserve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homeserve}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homeserve} -d ${POSTGRES_DB:-homeserve}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  data-service:
    build: ./services/data-service
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homeserve}
      POSTGRES_USER: ${POSTGRES_USER:-homeserve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homeserve}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: '*'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Use http.client with 127.0.0.1 so Docker/Desktop proxy variables cannot
      # intercept the local probe. A start period allows migrations and seeding
      # to finish before failed checks count against container health.
      test:
        - CMD
        - python
        - -c
        - >-
          import http.client, sys;
          connection = http.client.HTTPConnection('127.0.0.1', 8000, timeout=3);
          connection.request('GET', '/health/');
          response = connection.getresponse();
          sys.exit(0 if response.status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 45s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      PORT: 4000
      NODE_ENV: production
      DATA_SERVICE_URL: http://data-service:8000
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      SMTP_URL: ${SMTP_URL:-}
    depends_on:
      data-service:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      # Node itself performs the probe, so the image does not depend on wget.
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:4000/api/health')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
